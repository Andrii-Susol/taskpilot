# Governed by CODEOWNERS - changes need owner review
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege: the default GITHUB_TOKEN can only read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test              # this name becomes the required status check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false   # the token is not left in .git/config
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
