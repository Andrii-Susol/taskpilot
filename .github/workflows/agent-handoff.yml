name: Agent Handoff
on:
  workflow_dispatch:
    inputs:
      question:
        description: Read-only analysis question for the agent
        required: true
        default: "List every HTTP route in src/routes/tasks.js with method, path and the status codes it can return, as one Markdown table."

permissions:
  contents: read

concurrency:
  group: agent-handoff
  cancel-in-progress: false

jobs:
  # JOB 1 - the agent: read-only token, no persisted credentials, read-only tools, credit cap.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Read-only agent analysis (capped, bounded retries)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          QUESTION: ${{ inputs.question }}
          MODEL: ${{ vars.LAB_MODEL || 'auto' }}
          MAX_AI_CREDITS: "30"
          MAX_RETRIES: "2"
          AGENT_OUTPUT_FILE: output/report.md
        run: |
          mkdir -p output
          .github/scripts/run-agent.sh "$QUESTION" \
            --model "$MODEL" -s --no-auto-update --disable-builtin-mcps \
            --available-tools 'view,grep,glob' --allow-tool 'read' \
            --share output/session.md
      - name: Upload agent output (the only thing that leaves this job)
        uses: actions/upload-artifact@v4
        with:
          name: agent-report
          path: output/
          retention-days: 7
          if-no-files-found: error

  # JOB 2 - deterministic validation of the agent's output. No AI, no write permissions.
  validate:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-report
          path: artifacts/
      - name: Validate report
        id: check
        run: |
          f=artifacts/report.md
          size=$(wc -c < "$f")
          echo "Report size: ${size} bytes"
          if [ "$size" -lt 50 ] || [ "$size" -gt 100000 ]; then echo "::error::Report size out of bounds"; exit 1; fi
          if ! grep -q '^|' "$f"; then echo "::error::Expected a Markdown table"; exit 1; fi
          if grep -qE 'ghp_|github_pat_|-----BEGIN|<script' "$f"; then echo "::error::Suspicious content in agent output"; exit 1; fi
          echo "valid=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Agent report (validated)"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} | Commit: ${GITHUB_SHA}"
            echo
            cat "$f"
          } >> "$GITHUB_STEP_SUMMARY"

  # JOB 3 - the only job with a write permission. It publishes validated content; it runs no AI.
  publish:
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-report
          path: artifacts/
      - name: Publish as an issue with a traceability footer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODEL: ${{ vars.LAB_MODEL || 'auto' }}
        run: |
          {
            cat artifacts/report.md
            echo
            echo "---"
            echo "Generated by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA} · Model: ${MODEL} · Triggered by: @${GITHUB_ACTOR}"
          } > body.md
          gh issue create --title "Agent analysis (run ${GITHUB_RUN_ID})" --body-file body.md --label report
